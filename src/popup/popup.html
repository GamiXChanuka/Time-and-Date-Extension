<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time & Date Extension</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="header">
        <button id="refreshBtn" type="button" aria-label="Refresh time and date">
          Refresh
        </button>
      </header>
      <div class="content">
        <time id="timeValue" datetime="00:00:00">--:--:--</time>
        <time id="dateValue" datetime="2000-01-01">--/--/----</time>
      </div>
      <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
